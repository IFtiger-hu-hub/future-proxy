# Mihomo 默认基础配置
mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false

external-controller: 127.0.0.1:9090
secret: "future-proxy-secret"
external-ui: ui

tun:
  enable: false
  stack: gvisor
  device: Mihomo
  dns-hijack:
    - "any:53"
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 223.5.5.5
    - 119.29.29.29

proxies: []
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - DIRECT

rules:
  - MATCH,DIRECT
