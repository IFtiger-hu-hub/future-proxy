[package]
name = "future-proxy"
version = "1.0.9"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
regex = "1.10"
url = "2.5"

[target.'cfg(unix)'.dependencies]
ureq = { version = "2.10", features = ["json"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "2.10", default-features = false, features = ["json", "gzip", "native-tls"] }
native-tls = "0.2"
