[package]
name = "future-proxy"
version = "1.1.1"
edition = "2021"
default-run = "future-proxy"

[[bin]]
name = "future-proxy"
path = "src/main.rs"

[[bin]]
name = "future-proxy-setup"
path = "src/bin/setup.rs"
test = false

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
regex = { version = "1.10", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
url = "2.5"

[target.'cfg(unix)'.dependencies]
ureq = { version = "2.10", features = ["json"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(windows)'.dependencies]
ureq = { version = "2.10", default-features = false, features = ["json", "gzip", "native-tls"] }
native-tls = "0.2"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
